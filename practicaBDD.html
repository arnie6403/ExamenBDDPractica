  <style>
  * { 
    margin: 0; 
    padding: 0; 
  }
  body { 
    font: 14px/1.4 Palatino, Serif; 
  }
  
  /* 
  Generic Styling, for Desktops/Laptops 
  */
  table { 
    width: 100%; 
    border-collapse: collapse; 
  }
  /* Zebra striping */
  tr:nth-of-type(odd) { 
    background: #eee; 
  }
  th { 
    background: #333; 
    color: white; 
    font-weight: bold; 
  }
  td, th { 
    padding: 6px; 
    border: 1px solid #9B9B9B; 
    text-align: left; 
  }
  @media 
  only screen and (max-width: 760px),
  (min-device-width: 768px) and (max-device-width: 1024px)  {
    table, thead, tbody, th, td, tr { display: block; }
    thead tr { position: absolute;top: -9999px;left: -9999px;}
    tr { border: 1px solid #9B9B9B; }
    td { border: none;border-bottom: 1px solid #9B9B9B; position: relative;padding-left: 50%; }
    
    td:before { position: absolute;top: 6px;left: 6px;width: 45%; padding-right: 10px; white-space: nowrap;}
    
    /*
    Label the data
    */
td:nth-of-type(1):before { content: "ID_PEDIDO"; }
td:nth-of-type(2):before { content: "CLIENTE"; }
td:nth-of-type(3):before { content: "EMAIL"; }
td:nth-of-type(4):before { content: "FECHA_PEDIDO"; }
td:nth-of-type(5):before { content: "NOMBRE_PRODUCTO"; }
td:nth-of-type(6):before { content: "CANTIDAD"; }
td:nth-of-type(7):before { content: "PRECIO_UNITARIO"; }
td:nth-of-type(8):before { content: "SUBTOTAL"; }
  }
  
  /* Smartphones (portrait and landscape) ----------- */
  @media only screen
  and (min-device-width : 320px)
  and (max-device-width : 480px) {
    body { 
      padding: 0; 
      margin: 0; 
      width: 320px; }
    }
  
  /* iPads (portrait and landscape) ----------- */
  @media only screen and (min-device-width: 768px) and (max-device-width: 1024px) {
    body { 
      width: 495px; 
    }
  }

    p.id_pedido,
    c.nombre AS cliente,
    c.email,

    pr.nombre_producto,
    dp.cantidad,
    pr.precio AS precio_unitario,
    (dp.cantidad * pr.precio) AS subtotal
